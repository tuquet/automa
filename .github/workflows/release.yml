name: Release Automa Engine

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Package Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: automa-v${{ github.ref_name || inputs.version }}-windows-x64.zip
            asset_name: automa-v1.0.0-windows-x64.zip

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Dependencies
        run: pnpm install

      - name: Build Web Assets (@automa/webe)
        run: pnpm -F @automa/webe run build

      - name: Build Rust Core Engine
        run: cargo build --release --manifest-path apps/core/Cargo.toml

      - name: Package Release Assets (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "release-staging" -Force
          Copy-Item "apps/core/target/release/automa-core.exe" -Destination "release-staging/automa.exe"
          Copy-Item "apps/core/target/release/automa-core.exe" -Destination "release-staging/automa-core.exe"
          if (Test-Path "apps/webe/dist") {
            Copy-Item "apps/webe/dist" -Destination "release-staging/dist" -Recurse
          }
          Compress-Archive -Path "release-staging/*" -DestinationPath "${{ env.RELEASE_ZIP_NAME }}" -Force
        env:
          RELEASE_ZIP_NAME: ${{ matrix.asset_name }}

      - name: Create GitHub Release & Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || format('v{0}', inputs.version) }}
          name: Release ${{ github.ref_name || format('v{0}', inputs.version) }}
          draft: false
          prerelease: false
          files: |
            automa-v1.0.0-windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
