name: Publish VS Code Extension

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code & Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies (Root Workspace)
        run: pnpm install --frozen-lockfile

      - name: Package Extension (VSIX)
        working-directory: ./automa-vscode
        run: npx @vscode/vsce package --no-dependencies

      - name: Publish to VS Code Marketplace
        uses: lannonbr/vsce-action@master
        with:
          args: "publish -p ${{ secrets.VSCE_PAT }}"
          packagePath: "./automa-vscode"

      - name: Upload VSIX to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: ./automa-vscode/*.vsix
