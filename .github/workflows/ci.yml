name: Ecosystem CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_verify:
    name: Build & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo & Submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.GH_PAT }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Inject Pass Key
        run: echo "export default function() { return '${{ secrets.AUTOMA_MASTER_KEY }}'; }" > automa-webe/src/utils/getPassKey.js

      - name: Build
        run: pnpm run build

      # Note: Automatic changesets action has been removed in favor of Per-Submodule Changesets.
      # Publishing happens per-submodule manually or through distinct release jobs.
