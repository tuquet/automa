<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Automa E2E Test Fixture - Forms & DOM</title>
  <style>
    body { font-family: sans-serif; margin: 40px; }
    .container { max-width: 500px; padding: 20px; border: 1px solid #ccc; border-radius: 8px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input[type="text"], input[type="email"] { width: 100%; padding: 8px; box-sizing: border-box; }
    button { padding: 10px 20px; background: #0066cc; color: white; border: none; border-radius: 4px; cursor: pointer; }
    #result-box { margin-top: 20px; padding: 15px; background: #e6f7ff; border: 1px solid #91d5ff; border-radius: 4px; display: none; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Automa Test Registration Form</h2>
    <form id="test-form" onsubmit="event.preventDefault(); handleSubmit();">
      <div class="form-group">
        <label for="username">User Name</label>
        <input type="text" id="username" name="username" placeholder="Enter username" required />
      </div>
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="Enter email" required />
      </div>
      <div class="form-group">
        <label>
          <input type="checkbox" id="subscribe" name="subscribe" checked />
          Subscribe to notifications
        </label>
      </div>
      <button type="submit" id="btn-submit">Submit Form</button>
    </form>

    <div id="result-box">
      <p id="result-status">Status: Success</p>
      <p id="result-user">Submitted User: <span id="out-username"></span></p>
      <p id="result-email">Submitted Email: <span id="out-email"></span></p>
    </div>
  </div>

  <script>
    function handleSubmit() {
      const username = document.getElementById('username').value;
      const email = document.getElementById('email').value;
      
      document.getElementById('out-username').textContent = username;
      document.getElementById('out-email').textContent = email;
      document.getElementById('result-box').style.display = 'block';
    }
  </script>
</body>
</html>
